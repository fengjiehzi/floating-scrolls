services:
  - type: web
    name: floating-scrolls
    runtime: node
    rootDir: 万卷浮生_Web应用
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/characters
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/floating-scrolls.db
    disk:
      name: floating-scrolls-data
      mountPath: /var/data
      sizeGB: 1
