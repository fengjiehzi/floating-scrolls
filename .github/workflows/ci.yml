name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 万卷浮生_Web应用
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 万卷浮生_Web应用/package-lock.json
      - run: npm ci
      - name: Check server syntax
        run: |
          node --check server.js
          node --check auth.js
          node --check ws-server.js
          node --check ai-service.js
          node --check battle-engine.js
      - name: Smoke-test HTTP and WebSocket startup
        shell: bash
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 8888
          JWT_SECRET: ci-only-not-a-production-secret
          DB_PATH: ${{ runner.temp }}/floating-scrolls-ci.db
        run: |
          npm start > "$RUNNER_TEMP/floating-scrolls-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..20}; do
            if node -e "fetch('http://127.0.0.1:8888/api/characters').then(r => { if (!r.ok) process.exit(1) })"; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/floating-scrolls-server.log"
            exit 1
          fi

          node -e "const WebSocket=require('ws'); const ws=new WebSocket('ws://127.0.0.1:8888'); const timer=setTimeout(() => process.exit(1), 5000); ws.on('message', raw => { const data=JSON.parse(raw); if (data.type === 'error') { clearTimeout(timer); ws.close(); process.exit(0); } }); ws.on('error', () => process.exit(1));"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
