name: Godot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Headless content and gameplay validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $engineDir = Join-Path $env:RUNNER_TEMP 'godot'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $engineDir
          $engine = Get-ChildItem $engineDir -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          "GODOT_BIN=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify migrated asset manifest
        shell: pwsh
        run: |
          $failures = @()
          foreach ($line in Get-Content 'assets/art/manifest.sha256') {
            if (-not $line.Trim()) { continue }
            if ($line -notmatch '^([0-9a-fA-F]{64})  (.+)$') {
              $failures += "Invalid manifest line: $line"
              continue
            }
            $expected = $Matches[1]
            $path = $Matches[2]
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $failures += "Missing asset: $path"
              continue
            }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected) {
              $failures += "Hash mismatch: $path"
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }

      - name: Reject online runtime hooks
        shell: pwsh
        run: |
          $patterns = @('/api', 'WebSocket', 'apiKey', 'VITE_API_BASE_URL')
          $files = @('project.godot', 'export_presets.cfg') + @(Get-ChildItem scripts,scenes -Recurse -File | Select-Object -ExpandProperty FullName)
          $hits = Select-String -LiteralPath $files -Pattern $patterns -SimpleMatch
          if ($hits) { throw ($hits | Out-String) }

      - name: Run Godot headless suite
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . tests/test_runner.tscn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
